name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Create signing key (CI only)
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/sd.jks" -storetype JKS \
            -alias superdownloader -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass sdpass123 -keypass sdpass123 \
            -dname "CN=Super Downloader, OU=Tez, O=Super Downloader, C=US"
          echo "SD_KEYSTORE=$RUNNER_TEMP/sd.jks" >> "$GITHUB_ENV"
          echo "SD_KEYSTORE_PASSWORD=sdpass123" >> "$GITHUB_ENV"
          echo "SD_KEY_ALIAS=superdownloader" >> "$GITHUB_ENV"
          echo "SD_KEY_PASSWORD=sdpass123" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/SuperDownloader.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: SuperDownloader-apk
          path: dist/SuperDownloader.apk

      - name: Publish to release v1.0.0
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 dist/SuperDownloader.apk --clobber
          else
            gh release create v1.0.0 dist/SuperDownloader.apk --title "Super Downloader v1.0.0" \
              --notes "Super Downloader 1.0.0. Android APK (signed with a CI key) and unsigned iOS IPA for sideloading. Created by Tez." \
            || gh release upload v1.0.0 dist/SuperDownloader.apk --clobber
          fi
