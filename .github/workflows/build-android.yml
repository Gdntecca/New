name: Android APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the APK as a pre-release (v0.0.1-pre-alpha)'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Create signing key (CI only)
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/sd.jks" -storetype JKS \
            -alias superdownloader -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass sdpass123 -keypass sdpass123 \
            -dname "CN=Super Downloader, O=Super Downloader, C=US"
          echo "SD_KEYSTORE=$RUNNER_TEMP/sd.jks" >> "$GITHUB_ENV"
          echo "SD_KEYSTORE_PASSWORD=sdpass123" >> "$GITHUB_ENV"
          echo "SD_KEY_ALIAS=superdownloader" >> "$GITHUB_ENV"
          echo "SD_KEY_PASSWORD=sdpass123" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Collect APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/SuperDownloader-pre-alpha.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: SuperDownloader-pre-alpha-apk
          path: dist/SuperDownloader-pre-alpha.apk

      - name: Publish pre-release v0.0.1-pre-alpha
        if: ${{ inputs.publish }}
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.0.1-pre-alpha >/dev/null 2>&1; then
            gh release upload v0.0.1-pre-alpha dist/SuperDownloader-pre-alpha.apk --clobber
          else
            gh release create v0.0.1-pre-alpha dist/SuperDownloader-pre-alpha.apk --prerelease \
              --title "Super Downloader 0.0.1 Pre-alpha (Android)" \
              --notes "Pre-alpha Android build. Unfinished; expect bugs."
          fi
