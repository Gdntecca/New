name: SuperDownloader
options:
  bundleIdPrefix: com.tzzzzgdnnn
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  SDCore:
    path: SDCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  SuperDownloader:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: SDCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tzzzzgdnnn.superdownloader
        PRODUCT_NAME: SuperDownloader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ARCHS: arm64
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Super Downloader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SDReleaseLabel: pre-alpha
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Scan QR codes that contain download links.
        NSFaceIDUsageDescription: Unlock your private downloads folder.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.tzzzzgdnnn.superdownloader
            CFBundleURLSchemes: [superdl]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
